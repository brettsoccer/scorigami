name: MSU Scorigami
on:
  schedule:
    # Game days only (generated from the 2026-27 schedule). Times are UTC:
    # 16-23 = 11am-6pm Eastern, 0-6 (next UTC day) = 7pm-1am Eastern.
    # To refresh for a new season, ask Claude to regenerate this list.
    - cron: "*/30 0-6 14,18,22,27 11 *"
    - cron: "*/30 16-23 13,17,21,26 11 *"
    - cron: "*/30 0-6 3,6,10,13,20,23,30 12 *"
    - cron: "*/30 16-23 2,5,9,12,19,22,29 12 *"
    - cron: "*/30 0-6 3,6,10,13,17,24,27,31 1 *"
    - cron: "*/30 16-23 2,5,9,12,16,23,26,30 1 *"
    - cron: "*/30 0-6 3,6,11,14,17,21,24,27 2 *"
    - cron: "*/30 16-23 2,5,10,13,16,20,23,26 2 *"
    - cron: "*/30 0-6 3,7 3 *"
    - cron: "*/30 16-23 2,6 3 *"
    # postseason (Big Ten + NCAA tournaments, dates not set yet)
    - cron: "*/30 0-6,16-23 10-31 3 *"
    - cron: "*/30 0-6,16-23 1-8 4 *"
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: scorigami
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Check for new games
        env:
          CONSUMER_KEY: ${{ secrets.CONSUMER_KEY }}
          CONSUMER_SECRET: ${{ secrets.CONSUMER_SECRET }}
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          ACCESS_TOKEN_SECRET: ${{ secrets.ACCESS_TOKEN_SECRET }}
          POST_LIVE: ${{ vars.POST_LIVE }}
        run: python scorigami_bot.py --watch
      - name: Save updated history
        if: always()
        run: |
          git config user.name "scorigami-bot"
          git config user.email "bot@users.noreply.github.com"
          git add history.csv
          [ -f state.json ] && git add state.json || true
          git diff --cached --quiet || (git commit -m "Update history" && git push)
